{% extends "base.html" %}
{% block content %}
<div class="row justify-content-center"><div class="col-sm-8 col-md-5 col-lg-4"><div class="card">
  <div class="card-header bg-primary text-white"><i class="bi bi-person-plus me-1"></i>Create account</div>
  <div class="card-body p-4"><form method="POST">
    <input type="hidden" name="csrf_token" value="{{ csrf_token() }}" />
    <div class="mb-3"><label for="name" class="form-label fw-semibold">Name</label><input id="name" name="name" class="form-control" required autofocus></div>
    <div class="mb-3"><label for="login_id" class="form-label fw-semibold">10-digit User ID</label><input id="login_id" name="login_id" class="form-control" inputmode="numeric" pattern="[0-9]{10}" maxlength="10" required></div>
    <div class="mb-3"><label for="password" class="form-label fw-semibold">Password</label><input id="password" name="password" type="password" class="form-control" autocomplete="new-password" required></div>
    <div class="mb-3"><label for="confirm_password" class="form-label fw-semibold">Confirm password</label><input id="confirm_password" name="confirm_password" type="password" class="form-control" autocomplete="new-password" required></div>
    <button class="btn btn-primary w-100">Create account</button>
  </form><p class="text-center small mt-3 mb-0"><a href="{{ url_for('main.login') }}">Back to sign in</a></p></div>
</div></div></div>
{% endblock %}
